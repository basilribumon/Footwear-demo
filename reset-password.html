<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4f0" />
  <title>Reset admin password — ATHMAN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="password-reset-page">
  <main class="password-reset-card">
    <a class="brand" href="index.html">ATHMAN<span>®</span></a>
    <p class="eyebrow">STORE MANAGEMENT</p>
    <h1>Choose a new password</h1>
    <p class="reset-copy">Set a new password for your store admin account.</p>
    <form id="reset-form" hidden>
      <label>New password<input name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters" /></label>
      <label>Confirm new password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again" /></label>
      <button class="primary-button" type="submit">Update password <span>→</span></button>
    </form>
    <p id="reset-status" role="status">Checking your secure reset link…</p>
    <a class="reset-back" href="admin.html">Back to admin sign in</a>
  </main>
  <script type="module" src="reset-password.js"></script>
</body>
</html>
